name: Deploy to GitHub Pages

# Static export → GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# If you later serve the site from a custom domain (or from
# https://<user>.github.io), delete the NEXT_BASE_PATH line below — the
# workflow only needs a base path for project sites, which live under
# https://<user>.github.io/<repo>/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:static
        env:
          NEXT_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
